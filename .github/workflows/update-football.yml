name: Actualizar datos BETPRO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener datos de API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const key = process.env.API_FOOTBALL_KEY;

          if (!key) {
            throw new Error("No existe API_FOOTBALL_KEY");
          }

          const leagues = [
            [140, "LaLiga"],
            [39, "Premier League"],
            [135, "Serie A"],
            [78, "Bundesliga"],
            [141, "Segunda División"]
          ];

          const season = 2026;

          async function getFixtures(league, name) {
            const url =
              `https://v3.football.api-sports.io/fixtures?league=${league}` +
              `&season=${season}&next=10`;

            const response = await fetch(url, {
              headers: {
                "x-apisports-key": key
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            return (data.response || []).map(x => ({
              id: x.fixture.id,
              league: name,
              date: x.fixture.date,
              status: x.fixture.status.short,
              home: x.teams.home.name,
              away: x.teams.away.name,
              homeScore: x.goals.home,
              awayScore: x.goals.away
            }));
          }

          (async () => {
            let games = [];

            for (const [league, name] of leagues) {
              try {
                games.push(...await getFixtures(league, name));
              } catch (error) {
                console.log(`Error en ${name}:`, error.message);
              }
            }

            games = [...new Map(games.map(x => [x.id, x])).values()];

            games.sort(
              (a, b) => new Date(a.date) - new Date(b.date)
            );

            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "data/football.json",
              JSON.stringify({
                updatedAt: new Date().toISOString(),
                source: "API-Football",
                games
              }, null, 2)
            );

            console.log(`BETPRO: ${games.length} partidos actualizados`);
          })();
          NODE

      - name: Guardar datos
        run: |
          git config user.name "BETPRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/football.json
          git diff --cached --quiet || git commit -m "Actualizar datos BETPRO"
          git push
