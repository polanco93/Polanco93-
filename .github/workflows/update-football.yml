name: Actualizar datos BETPRO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener datos de API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const KEY = process.env.API_FOOTBALL_KEY;
          const BASE = "https://v3.football.api-sports.io";
          const SEASON = 2026;

          if (!KEY) {
            throw new Error("Falta el secreto API_FOOTBALL_KEY");
          }

          const leagues = [
            [140, "LaLiga"],
            [39, "Premier League"],
            [135, "Serie A"],
            [78, "Bundesliga"],
            [141, "Segunda División"]
          ];

          async function obtener(league, name) {
            const url =
              `${BASE}/fixtures?league=${league}&season=${SEASON}&next=10`;

            const response = await fetch(url, {
              headers: {
                "x-apisports-key": KEY
              }
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            if (data.errors && Object.keys(data.errors).length > 0) {
              throw new Error(JSON.stringify(data.errors));
            }

            return (data.response || []).map(x => ({
              id: x.fixture.id,
              league: name,
              date: x.fixture.date,
              status: x.fixture.status.short,
              home: x.teams.home.name,
              away: x.teams.away.name,
              homeScore: x.goals.home,
              awayScore: x.goals.away
            }));
          }

          (async () => {
            let games = [];
            let errores = [];

            for (const [league, name] of leagues) {
              try {
                const partidos = await obtener(league, name);
                console.log(`${name}: ${partidos.length} partidos`);
                games.push(...partidos);
              } catch (error) {
                console.log(`ERROR ${name}: ${error.message}`);
                errores.push({
                  liga: name,
                  error: error.message
                });
              }
            }

            games = [...new Map(
              games.map(game => [game.id, game])
            ).values()];

            games.sort(
              (a, b) => new Date(a.date) - new Date(b.date)
            );

            const resultado = {
              actualizadoEn: new Date().toISOString(),
              fuente: "API-Football",
              temporada: SEASON,
              juegos: games,
              errores: errores
            };

            fs.mkdirSync("datos", { recursive: true });
            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "datos/fútbol.json",
              JSON.stringify(resultado, null, 2)
            );

            fs.writeFileSync(
              "data/football.json",
              JSON.stringify(resultado, null, 2)
            );

            console.log(`BETPRO: ${games.length} partidos actualizados`);

            if (games.length === 0) {
              throw new Error(
                "API-Football devolvió 0 partidos. Revisa los errores mostrados arriba."
              );
            }
          })();
          NODE

      - name: Guardar datos
        run: |
          git config user.name "Bot BETPRO"
          git config user.email "actions@users.noreply.github.com"

          git add datos/fútbol.json data/football.json

          git diff --cached --quiet || git commit -m "Actualizar datos reales de fútbol"

          git push
