name: Actualizar datos BETPRO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener datos reales de API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const key = process.env.API_FOOTBALL_KEY;

          if (!key) {
            throw new Error("Falta el secreto API_FOOTBALL_KEY");
          }

          const ligas = [
            [140, "LaLiga"],
            [39, "Premier League"],
            [135, "Serie A"],
            [78, "Bundesliga"],
            [141, "Segunda División"]
          ];

          const temporada = 2026;

          async function obtenerPartidos(idLiga, nombreLiga) {
            const url =
              `https://v3.football.api-sports.io/fixtures` +
              `?league=${idLiga}` +
              `&season=${temporada}` +
              `&next=10`;

            const respuesta = await fetch(url, {
              headers: {
                "x-apisports-key": key
              }
            });

            const datos = await respuesta.json();

            if (!respuesta.ok) {
              throw new Error(
                `${nombreLiga}: HTTP ${respuesta.status}`
              );
            }

            if (datos.errors && Object.keys(datos.errors).length > 0) {
              throw new Error(
                `${nombreLiga}: ${JSON.stringify(datos.errors)}`
              );
            }

            return (datos.response || []).map(partido => ({
              id: partido.fixture.id,
              league: nombreLiga,
              date: partido.fixture.date,
              status: partido.fixture.status.short,
              home: partido.teams.home.name,
              away: partido.teams.away.name,
              homeScore: partido.goals.home,
              awayScore: partido.goals.away
            }));
          }

          (async () => {
            let partidos = [];
            let errores = [];

            for (const [idLiga, nombreLiga] of ligas) {
              try {
                const resultados =
                  await obtenerPartidos(idLiga, nombreLiga);

                console.log(
                  `${nombreLiga}: ${resultados.length} partidos`
                );

                partidos.push(...resultados);
              } catch (error) {
                console.log(
                  `ERROR ${nombreLiga}: ${error.message}`
                );

                errores.push(error.message);
              }
            }

            partidos = [
              ...new Map(
                partidos.map(partido => [partido.id, partido])
              ).values()
            ];

            partidos.sort(
              (a, b) =>
                new Date(a.date) - new Date(b.date)
            );

            if (partidos.length === 0) {
              throw new Error(
                "API-Football no devolvió ningún partido. " +
                "Revisa el secreto API_FOOTBALL_KEY, la cuota de la API " +
                "o la temporada solicitada. Errores: " +
                JSON.stringify(errores)
              );
            }

            const ahora = new Date().toISOString();

            const juegos = partidos.map(partido => ({
              id: partido.id,
              league: partido.league,
              date: partido.date,
              status: partido.status,
              home: partido.home,
              away: partido.away,
              homeScore: partido.homeScore,
              awayScore: partido.awayScore,

              a: partido.home,
              b: partido.away,

              score:
                partido.homeScore !== null &&
                partido.awayScore !== null
                  ? `${partido.homeScore} - ${partido.awayScore}`
                  : "—"
            }));

            const salida = {
              updatedAt: ahora,
              actualizadoEn: ahora,

              source: "API-Football",
              fuente: "API-Football",

              games: juegos,
              juegos: juegos
            };

            fs.mkdirSync("datos", { recursive: true });
            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "datos/fútbol.json",
              JSON.stringify(salida, null, 2)
            );

            fs.writeFileSync(
              "datos/football.json",
              JSON.stringify(salida, null, 2)
            );

            fs.writeFileSync(
              "data/football.json",
              JSON.stringify(salida, null, 2)
            );

            console.log(
              `BETPRO: ${partidos.length} partidos guardados correctamente`
            );
          })();
          NODE

      - name: Comprobar archivos
        run: |
          echo "Comprobando datos..."
          test -s datos/fútbol.json
          test -s datos/football.json
          test -s data/football.json

          echo "Archivos creados:"
          ls -lh datos/fútbol.json
          ls -lh datos/football.json
          ls -lh data/football.json

      - name: Guardar datos
        run: |
          git config user.name "BETPRO Bot"
          git config user.email "actions@users.noreply.github.com"

          git add datos/fútbol.json
          git add datos/football.json
          git add data/football.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar datos reales de fútbol"
            git push
          fi
