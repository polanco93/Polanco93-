name: Actualizar datos BETPRO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener fútbol real
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const KEY = process.env.API_FOOTBALL_KEY;

          if (!KEY) {
            throw new Error("Falta el secreto API_FOOTBALL_KEY");
          }

          const ligas = [
            [140, "LaLiga"],
            [39, "Premier League"],
            [135, "Serie A"],
            [78, "Bundesliga"],
            [141, "Segunda División"]
          ];

          const season = 2026;

          async function obtenerLiga(id, nombre) {
            const url =
              `https://v3.football.api-sports.io/fixtures` +
              `?league=${id}&season=${season}&next=10`;

            const r = await fetch(url, {
              headers: {
                "x-apisports-key": KEY
              }
            });

            const j = await r.json();

            if (!r.ok) {
              throw new Error(`${nombre}: HTTP ${r.status}`);
            }

            if (j.errors && Object.keys(j.errors).length) {
              throw new Error(`${nombre}: ${JSON.stringify(j.errors)}`);
            }

            return (j.response || []).map(x => ({
              id: x.fixture.id,
              league: nombre,
              date: x.fixture.date,
              status: x.fixture.status.short,
              home: x.teams.home.name,
              away: x.teams.away.name,
              homeScore: x.goals.home,
              awayScore: x.goals.away
            }));
          }

          (async () => {
            let juegos = [];

            for (const [id, nombre] of ligas) {
              try {
                const datos = await obtenerLiga(id, nombre);
                console.log(`${nombre}: ${datos.length} partidos`);
                juegos.push(...datos);
              } catch (e) {
                console.log(`ERROR ${nombre}: ${e.message}`);
              }
            }

            juegos = [...new Map(juegos.map(x => [x.id, x])).values()];

            juegos.sort(
              (a, b) => new Date(a.date) - new Date(b.date)
            );

            if (juegos.length === 0) {
              throw new Error(
                "API-Football no devolvió ningún partido. No se publicarán datos vacíos."
              );
            }

            const ahora = new Date().toISOString();

            const datos = {
              actualizadoEn: ahora,
              fuente: "API-Football",
              juegos: juegos,

              updatedAt: ahora,
              source: "API-Football",
              games: juegos
            };

            fs.mkdirSync("datos", { recursive: true });
            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "datos/fútbol.json",
              JSON.stringify(datos, null, 2)
            );

            fs.writeFileSync(
              "data/football.json",
              JSON.stringify(datos, null, 2)
            );

            console.log(`BETPRO: ${juegos.length} partidos guardados`);
          })();
          NODE

      - name: Guardar datos
        run: |
          git config user.name "BETPRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos/fútbol.json data/football.json
          git diff --cached --quiet || git commit -m "Actualizar fútbol BETPRO"
          git push
